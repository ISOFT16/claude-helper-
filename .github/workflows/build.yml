name: Build Vigil Launcher

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VigilLauncher-android
          path: app/build/outputs/apk/release/app-release.apk
      - name: Выложить APK в Releases
        run: |
          cp app/build/outputs/apk/release/app-release.apk VigilLauncher.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VigilLauncher.apk --target "$GITHUB_SHA" \
            --title "Vigil Launcher (последняя сборка)" \
            --notes "Скачайте VigilLauncher.apk и установите на Android 8.0 или новее."
        env:
          GH_TOKEN: ${{ github.token }}
