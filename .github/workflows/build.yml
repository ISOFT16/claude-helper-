name: Build Vigil Voice

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testDebugUnitTest assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: VigilVoice-android
          path: app/build/outputs/apk/release/app-release.apk
      - name: Выложить APK в Releases
        run: |
          cp app/build/outputs/apk/release/app-release.apk VigilVoice.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VigilVoice.apk --target "$GITHUB_SHA" \
            --title "Vigil Voice (последняя сборка)" \
            --notes "Скачайте VigilVoice.apk и установите на Android."
        env:
          GH_TOKEN: ${{ github.token }}
