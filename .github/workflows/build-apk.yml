name: Build Android APK

on:
  push:
    branches: [main, master, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the game (web bundle)
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SandForge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SandForge-apk
          path: SandForge.apk

      - name: Publish to the "latest-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag || true
          gh release create latest-apk SandForge.apk \
            --title "SandForge — последняя сборка" \
            --notes "Автоматическая сборка из ветки ${GITHUB_REF_NAME} (коммит ${GITHUB_SHA::7}). Скачайте SandForge.apk ниже и установите на Android." \
            --prerelease \
            --target "${GITHUB_SHA}"
