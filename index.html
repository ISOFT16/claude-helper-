<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Перехват — 3D-шутер</title>
<!-- Сгенерировано tools/build.py из src/. Правьте файлы в src/, а не этот файл. -->
<style>
  :root{--blue:#4fb3ff;--orange:#ff8a3d;--ink:#e9eef7;--dim:#93a0b8;--panel:rgba(10,14,24,.72)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0f19;color:var(--ink);font-family:"Segoe UI",Roboto,system-ui,sans-serif;user-select:none}
  canvas{display:block}
  .hidden{display:none!important}
  #hud{position:fixed;inset:0;pointer-events:none}
  /* top bar */
  #top{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
  #scorebar{display:flex;align-items:center;gap:14px;background:var(--panel);padding:6px 16px;border-radius:10px;font-weight:700}
  #scorebar .t0{color:var(--blue)} #scorebar .t1{color:var(--orange)}
  #scorebar .num{font-size:26px;min-width:28px;text-align:center}
  #timer{font-size:20px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
  .dots{display:flex;gap:4px} .dot{width:9px;height:9px;border-radius:50%;opacity:.9}
  .dot.d0{background:var(--blue)} .dot.d1{background:var(--orange)} .dot.dead{background:#3a4152}
  #zone{background:var(--panel);padding:5px 12px;border-radius:8px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:280px}
  #zonebars{display:flex;gap:6px;width:100%}
  .zb{flex:1;height:7px;background:#232a3a;border-radius:4px;overflow:hidden}
  .zb i{display:block;height:100%;width:0}
  #zb0 i{background:var(--blue)} #zb1 i{background:var(--orange);margin-left:auto}
  /* bottom */
  #bl{position:absolute;left:18px;bottom:16px;display:flex;flex-direction:column;gap:6px}
  #money{font-size:20px;font-weight:700;color:#8ff59a;text-shadow:0 1px 3px #000}
  #vitals{display:flex;gap:18px;background:var(--panel);padding:8px 16px;border-radius:10px;font-size:30px;font-weight:800;align-items:baseline}
  #vitals small{font-size:12px;color:var(--dim);font-weight:600;margin-right:4px}
  #dash{font-size:12px;color:var(--dim)} #dash b{color:#7fe7ff}
  #br{position:absolute;right:18px;bottom:16px;text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
  #wname{font-size:14px;color:var(--dim);background:var(--panel);padding:4px 10px;border-radius:6px}
  #ammo{background:var(--panel);padding:8px 16px;border-radius:10px;font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
  #ammo small{font-size:18px;color:var(--dim)}
  #nades{font-size:13px;color:var(--dim)}
  /* crosshair */
  #cross{position:absolute;left:50%;top:50%;width:0;height:0}
  #cross i,.xprev i{position:absolute;left:0;top:0;display:block}
  #cross .xc{border-radius:50%;background:transparent} #cross .xd{border-radius:50%}
  #hit{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;opacity:0;transition:opacity .15s}
  #hit:before,#hit:after{content:"";position:absolute;left:50%;top:0;width:2px;height:100%;background:#fff;transform:rotate(45deg)}
  #hit:after{transform:rotate(-45deg)}
  #hit.hs:before,#hit.hs:after{background:#ff4d4d}
  #dmg{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px rgba(255,0,0,.55);opacity:0;transition:opacity .25s}
  #dmgarrow,#whizarrow{position:absolute;left:50%;top:50%;width:0;height:0}
  #whizarrow i{position:absolute;left:-22px;top:-175px;width:44px;height:14px;border-radius:50% 50% 0 0;border-top:3px solid #ffd85a;opacity:0;transition:opacity .5s}
  #gearhud{display:flex;gap:4px;flex-wrap:wrap;max-width:260px}
  #gearhud span{font-size:10px;color:#cfd6e6;background:rgba(10,14,24,.55);border-radius:5px;padding:2px 5px;display:flex;align-items:center;gap:4px}
  #gearhud b{display:inline-block;width:26px;height:4px;border-radius:2px;background:#2a3142;overflow:hidden;position:relative}
  #gearhud b i{position:absolute;left:0;top:0;bottom:0;background:#7dffb0}
  #dashbar{display:inline-block;width:44px;height:4px;border-radius:2px;background:#2a3142;margin-left:6px;vertical-align:middle;position:relative;overflow:hidden}
  #dashbar i{position:absolute;left:0;top:0;bottom:0;background:#7dc8ff}
  #dmgarrow i{position:absolute;left:-14px;top:-150px;width:28px;height:36px;background:linear-gradient(#ff3b3b,transparent);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:0;transition:opacity .4s}
  #feed{position:absolute;right:14px;top:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-size:14px}
  #feed div{background:var(--panel);padding:4px 10px;border-radius:6px}
  #feed .me{outline:1px solid #ffd85a}
  .c0{color:var(--blue);font-weight:700}.c1{color:var(--orange);font-weight:700}
  #center{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;font-size:40px;font-weight:900;text-shadow:0 3px 12px #000;letter-spacing:1px}
  #center small{display:block;font-size:17px;font-weight:600;color:var(--ink);margin-top:6px}
  #hint{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);font-size:15px;color:#ffd85a;text-shadow:0 1px 4px #000;text-align:center}
  #radar{position:absolute;left:14px;top:12px;border-radius:8px;background:rgba(8,12,20,.7);border:1px solid #2b3550}
  #scope{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,transparent 0 33vh,#000 33.2vh)}
  #scope.lite{background:radial-gradient(circle at 50% 50%,transparent 0 40vh,rgba(0,0,0,.85) 40.5vh)}
  #scope:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
  #scope:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:#000}
  /* overlays */
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,14,.78);z-index:10}
  .card{background:#121929;border:1px solid #2b3550;border-radius:16px;padding:26px 32px;max-width:760px;width:calc(100% - 32px);max-height:calc(100% - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  h1{margin:0 0 4px;font-size:52px;letter-spacing:6px;background:linear-gradient(90deg,var(--blue),#c7a6ff,var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{color:var(--dim);margin:0 0 18px}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
  button{font:inherit;cursor:pointer;border:1px solid #33405e;background:#1b2438;color:var(--ink);padding:10px 18px;border-radius:10px;font-weight:700}
  button:hover{background:#25314d} button.sel{border-color:#7dffb0;color:#7dffb0}
  button.go{background:linear-gradient(90deg,#2a7fd4,#7c4fd8);border:none;font-size:20px;padding:12px 34px}
  .keys{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;color:var(--dim);margin-top:14px}
  .keys b{color:var(--ink);font-weight:700}
  #buy .card{max-width:560px}
  #buy{background:rgba(5,8,14,.45);pointer-events:none}
  #buy .card{pointer-events:auto}
  .item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:8px;border:1px solid #26314a;margin:6px 0;cursor:pointer}
  .item:hover{background:#1c2640} .item.no{opacity:.4} .item.own{border-color:#7dffb0}
  .item kbd{background:#2a3550;padding:2px 8px;border-radius:5px;margin-right:10px;font-family:inherit}
  .price{color:#8ff59a;font-weight:700}
  #board table{width:100%;border-collapse:collapse;font-size:15px}
  #board td,#board th{padding:6px 8px;text-align:left;border-bottom:1px solid #222b40}
  #board th{color:var(--dim);font-weight:600}
  #board tr.deadrow td{opacity:.45} #board tr.mine td{background:#1d2742}
  label{color:var(--dim);font-size:14px}
  input[type=range]{width:220px;vertical-align:middle}
  .mpbox{border-top:1px solid #26314a;margin-top:12px;padding-top:10px}
  input[type=text],input:not([type]){font:inherit;background:#0d1320;color:var(--ink);border:1px solid #33405e;border-radius:10px;padding:9px 12px;width:180px}
  #room{background:var(--panel);padding:3px 12px;border-radius:8px;font-size:13px;color:#ffd85a}
  /* сенсорное управление */
  #touch{position:fixed;inset:0;z-index:5;touch-action:none;display:none}
  body.touch #touch.on{display:block}
  body.touch{touch-action:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  .tb{position:absolute;width:62px;height:62px;border-radius:50%;background:rgba(20,28,45,.5);border:2px solid rgba(255,255,255,.28);color:#fff;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1;touch-action:none;user-select:none;-webkit-user-select:none}
  .tb.pr{background:rgba(255,255,255,.32)} .tb.on{background:rgba(125,255,176,.32);border-color:#7dffb0} .tb.off{opacity:.35}
  #tFire{width:92px;height:92px;right:20px;bottom:36px;background:rgba(255,70,70,.38);border-color:rgba(255,140,140,.6);font-size:14px}
  #tJump{right:126px;bottom:18px} #tCrouch{right:196px;bottom:18px} #tReload{right:126px;bottom:90px} #tSwap{right:196px;bottom:90px}
  #tDash{right:20px;bottom:145px} #tNade{right:90px;bottom:165px} #tScope{right:160px;bottom:160px}
  .tsm{width:46px;height:46px;border-radius:12px;font-size:18px}
  #tProne{right:266px;bottom:18px} #tMap{top:62px;right:8px} #tProne.on{background:rgba(125,255,176,.32);border-color:#7dffb0}
  #tDash .cd{position:absolute;inset:-2px;border-radius:50%;pointer-events:none}
  #tPause{top:8px;right:8px} #tBoard{top:8px;right:60px} #tBuy{left:12px;top:108px;width:auto;padding:0 14px;height:40px;border-radius:10px;font-size:13px;background:rgba(40,120,70,.55)}
  #joyBase{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);display:none;pointer-events:none}
  #joyKnob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(255,255,255,.35)}
  body.touch #radar{width:140px;height:88px;top:8px;left:8px}
  body.touch #top{transform:translateX(-50%) scale(.78);transform-origin:top center;top:4px}
  body.touch #feed{top:62px;right:8px;font-size:11px}
  body.touch #bl{left:50%;bottom:4px;transform:translateX(-104%) scale(.7);transform-origin:bottom right}
  body.touch #br{right:auto;left:50%;bottom:4px;transform:translateX(4%) scale(.7);transform-origin:bottom left;align-items:flex-start;text-align:left}
  body.touch #dash{display:none}
  body.touch #center{font-size:28px;top:32%}
  body.touch #hint{bottom:auto;top:24%;font-size:13px}
  body.touch .keys{display:none}
  .touchhelp{display:none} body.touch .touchhelp{display:block}
  #rotate{display:none;position:fixed;inset:0;z-index:50;background:#0b0f19;align-items:center;justify-content:center;text-align:center;font-size:20px;padding:30px}
  @media (orientation:portrait){ body.touch #rotate{display:flex} }
  @media (max-height:500px){ #desc{display:none} #buylist{display:grid;grid-template-columns:1fr 1fr;gap:0 8px} #buylist .item .stats{display:none} #buy .card{max-width:720px} h1{font-size:34px} .card{padding:16px 20px} .sub{margin-bottom:8px;font-size:14px} button.go{font-size:17px;padding:10px 26px} .item{padding:6px 10px;margin:4px 0} }

  /* ===== v3: меню, настройки, разминка, чат ===== */
  #fps{position:absolute;right:10px;bottom:4px;font:600 12px monospace;color:#7dffb0;text-shadow:0 1px 2px #000}
  #lobby{background:rgba(40,120,70,.55);padding:5px 14px;border-radius:8px;font-size:13px;font-weight:600;text-align:center;max-width:620px}
  #flashw{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #dnums{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .dnum{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:18px;color:#fff;text-shadow:0 1px 3px #000;animation:dn .9s ease-out forwards}
  .dnum.hs{color:#ff5a5a;font-size:22px}
  @keyframes dn{from{opacity:1;margin-top:0}to{opacity:0;margin-top:-50px}}
  #chat{position:absolute;left:18px;bottom:150px;display:flex;flex-direction:column;gap:3px;font-size:14px;max-width:420px}
  #chat div{background:var(--panel);padding:3px 9px;border-radius:6px;transition:opacity 1s}
  #chat div.fade{opacity:0}
  #chatin{position:absolute;left:18px;bottom:118px;width:380px;pointer-events:auto;z-index:20}
  #nades span{margin-left:8px} #nades .nsel{color:#ffd85a;font-weight:700}
  .menu{background:radial-gradient(circle at 20% 30%,rgba(20,30,60,.55),rgba(5,8,14,.86));align-items:stretch;justify-content:flex-start}
  .menuwrap{display:flex;gap:28px;padding:40px 48px;width:100%;max-width:1200px;margin:auto;align-items:flex-start}
  .nav{display:flex;flex-direction:column;gap:10px;min-width:300px;max-width:360px}
  .nav h1{font-size:44px;letter-spacing:3px;white-space:nowrap}
  .nb{font-size:20px;text-align:left;padding:14px 22px;letter-spacing:1px;background:rgba(27,36,56,.75);border-color:#2f3b58}
  .nb:hover,.nb.sel{background:linear-gradient(90deg,#2a7fd4,#7c4fd8);border-color:transparent}
  .ver{color:var(--dim);font-size:12px;margin-top:8px}
  .panel{display:none;flex:1;background:rgba(18,25,41,.92);border:1px solid #2b3550;border-radius:16px;padding:22px 28px;max-height:calc(100vh - 80px);overflow:auto}
  .panel.on{display:block}
  .panel h2{margin:0 0 6px} .panel h3{margin:4px 0 8px}
  .backbtn{display:none;margin-bottom:10px;padding:6px 14px;font-size:14px}
  .field{margin:12px 0;display:flex;flex-direction:column;gap:6px}
  .seg{display:flex;flex-wrap:wrap;gap:6px} .seg button{padding:8px 14px}
  .mpcols{display:flex;gap:18px;flex-wrap:wrap} .mpcol{flex:1;min-width:240px;background:rgba(12,18,30,.6);border:1px solid #26314a;border-radius:12px;padding:12px 16px}
  select{font:inherit;background:#0d1320;color:var(--ink);border:1px solid #33405e;border-radius:10px;padding:8px 10px}
  .setcard{max-width:820px;height:min(640px,calc(100% - 32px));display:flex;flex-direction:column}
  .sethead{display:flex;align-items:center;gap:12px;margin-bottom:8px} .sethead h2{margin:0;flex:1}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px} .tabs button{padding:7px 12px;font-size:14px}
  .tabs kbd{background:#2a3550;padding:0 6px;border-radius:4px;font-family:inherit}
  #setbody{overflow:auto;flex:1;padding-right:6px}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 4px;border-bottom:1px solid #1d2638}
  .srow>span{color:var(--ink);font-size:15px} .srow .ctl{display:flex;align-items:center;gap:8px}
  .srow input[type=range]{width:180px} .srow .val{min-width:48px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
  .sw{position:relative;width:46px;height:26px;border-radius:13px;background:#2a3550;border:none;padding:0;cursor:pointer}
  .sw:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#93a0b8;transition:left .15s}
  .sw.on{background:#2dbf6a} .sw.on:after{left:23px;background:#fff}
  .keyb{min-width:72px;padding:6px 10px;font-size:14px} .keyb.wait{border-color:#ffd85a;color:#ffd85a}
  .swatch{width:26px;height:26px;border-radius:50%;border:2px solid #33405e;padding:0} .swatch.sel{border-color:#fff}
  .xprev{position:relative;width:120px;height:80px;background:#3b4252;border-radius:8px;margin:8px 0}
  .xprev #xpv{position:absolute;left:50%;top:50%}
  .note{color:#ffd85a;font-size:13px}
  .langs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .pbtns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
  .buycard{max-width:860px} .buycard .sethead .price{font-size:20px}
  #buylist .item>span:first-child{display:flex;flex-direction:column;gap:2px}
  .stats{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;flex-wrap:wrap}
  .bar{display:inline-block;width:60px;height:5px;background:#26314a;border-radius:3px;overflow:hidden} .bar b{display:block;height:100%;background:#7dffb0}
  .item em{color:#7dffb0;font-style:normal;font-size:12px}
  .item .nm{display:flex;align-items:center;gap:2px} .item .nm kbd{flex:none}
  .notouch{} body.touch .notouch{display:none}
  #tNadeSel{right:160px;bottom:226px} #tChat{top:8px;right:112px} #tStart{left:12px;top:156px;width:auto;padding:0 18px;height:44px;border-radius:10px;background:rgba(200,80,60,.6);font-size:14px}
  body.touch .tb{transform:scale(calc(var(--ts,1) * var(--bs,1)))}
  .tb{transform:scale(var(--bs,1))}
  body.touch #chat{bottom:auto;top:110px;left:160px;font-size:12px}
  body.touch #chatin{bottom:auto;top:60px;left:50%;transform:translateX(-50%);width:60%}
  body.touch #lobby{font-size:11px}
  @media (max-width:820px),(max-height:520px){
    .menuwrap{padding:12px;gap:12px} .nav{min-width:200px} .nav h1{font-size:32px} .nb{font-size:15px;padding:9px 14px}
    .menu.sub-open .nav{display:none} .menu.sub-open .backbtn{display:inline-block}
    .panel{max-height:calc(100vh - 24px);padding:14px 16px}
    .panel h2{font-size:20px;margin-bottom:2px} .panel .sub{margin-bottom:4px;font-size:13px} .field{margin:6px 0;gap:4px} .seg button{padding:6px 12px}
    .backbtn{margin-bottom:4px}
    .setcard{height:calc(100% - 16px);padding:12px 14px}
  }
  /* ===== v4: арсенал, подарки, монеты, список серверов ===== */
  .navcoins{font-size:20px;font-weight:800;color:#ffb35a;margin:-4px 0 4px}
  .nb{position:relative}
  .badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:#ff4d3d;color:#fff;font-style:normal;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:14px;animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:translateY(-50%) scale(1.18)}}
  .srvbox{margin-bottom:14px}
  #srvlist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto}
  .srv{display:flex;align-items:center;gap:12px;background:rgba(27,36,56,.7);border:1px solid #2b3550;border-radius:10px;padding:8px 12px}
  .srv>div{flex:1;display:flex;flex-direction:column} .srv small{color:var(--dim)} .srvn{font-weight:800;color:#7dffb0}
  .chk{display:flex;align-items:center;gap:8px;cursor:pointer} .chk input{width:18px;height:18px}
  .arwrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:nowrap}
  .argrid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;max-height:430px;overflow:auto;padding:2px}
  .arcard{background:rgba(27,36,56,.75);border:2px solid #2b3550;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;text-align:center}
  .arcard:hover{background:#25314d} .arcard.sel{border-color:#ffb35a} .arcard.eq{border-color:#7dffb0}
  .arcard b{font-size:13px} .arcard small{color:var(--dim);font-size:12px} .arcard.own small{color:#7dffb0}
  .arcard .ic{width:52px;height:52px;border-radius:50%;border:2px solid rgba(255,255,255,.15)} .arcard .emo{display:flex;align-items:center;justify-content:center;font-size:30px;background:#141a28}
  .arcard .tone{width:52px;height:52px;border-radius:50%}
  .arprev{width:clamp(190px,22vw,300px);display:flex;flex-direction:column;gap:8px;align-items:stretch}
  #prevc{width:100%;height:auto;aspect-ratio:300/380;background:radial-gradient(circle at 50% 40%,#2a3550,#0f1420);border-radius:14px}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
  .day{position:relative;background:rgba(27,36,56,.75);border:2px solid #2b3550;border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
  .day small{color:var(--dim)} .day b{font-size:15px;color:#ffb35a} .day em{font-style:normal;font-size:20px}

  .day.cur{border-color:#ffb35a;box-shadow:0 0 18px rgba(255,179,90,.35)}
  #coinpops{position:fixed;right:18px;top:120px;z-index:60;display:flex;flex-direction:column;gap:6px;align-items:flex-end;pointer-events:none}

  /* v8: карта мира */

  .wmbtns{display:flex;gap:8px} .wmbtns button{min-width:44px;height:40px;padding:0 14px;border-radius:9px;border:1px solid #33405e;background:#1d2538;color:#fff;font-weight:700;font-size:15px}
  body.touch .wmbar small{display:none}

  /* v8: броня в арсенале */

  /* v10: выбор карты */

/* ================= raycasting ================= */
const RB = { t: 0, ax: 0 };
function rayBox(ox, oy, oz, dx, dy, dz, x0, y0, z0, x1, y1, z1) {
  let tmin = -Infinity, tmax = Infinity, ax = -1;
  if (Math.abs(dx) < 1e-9) { if (ox < x0 || ox > x1) return false; }
  else { let a = (x0 - ox) / dx, b = (x1 - ox) / dx; if (a > b) { const t = a; a = b; b = t; } if (a > tmin) { tmin = a; ax = 0; } if (b < tmax) tmax = b; }
  if (Math.abs(dy) < 1e-9) { if (oy < y0 || oy > y1) return false; }
  else { let a = (y0 - oy) / dy, b = (y1 - oy) / dy; if (a > b) { const t = a; a = b; b = t; } if (a > tmin) { tmin = a; ax = 1; } if (b < tmax) tmax = b; }
  if (Math.abs(dz) < 1e-9) { if (oz < z0 || oz > z1) return false; }
  else { let a = (z0 - oz) / dz, b = (z1 - oz) / dz; if (a > b) { const t = a; a = b; b = t; } if (a > tmin) { tmin = a; ax = 2; } if (b < tmax) tmax = b; }
  if (tmax < tmin || tmin < 0) return false;
  RB.t = tmin; RB.ax = ax; return true;
}
const RW = { t: 0, nx: 0, ny: 0, nz: 0, hit: false, box: null };
// луч по миру: проход по клеткам сетки (DDA) и проверка коробок в каждой; skip — коробки, которые пропустить
function rayWorld(ox, oy, oz, dx, dy, dz, maxT, skip) {
  let best = maxT, nx = 0, ny = 0, nz = 0, hb = null;
  const fy = WORLD.groundPlane ? 0 : WORLD.floorY;
  if (dy < 0) { const t = (fy - oy) / dy; if (t >= 0 && t < best) { best = t; ny = 1; } }
  const W = WORLD, st = ++W.stamp;
  let cx = Math.floor(ox / CELL), cz = Math.floor(oz / CELL);
  const sx = dx > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
  const tdx = Math.abs(dx) > 1e-9 ? Math.abs(CELL / dx) : Infinity, tdz = Math.abs(dz) > 1e-9 ? Math.abs(CELL / dz) : Infinity;
  let tmx = Math.abs(dx) > 1e-9 ? (dx > 0 ? (cx + 1) * CELL - ox : ox - cx * CELL) / Math.abs(dx) : Infinity;
  let tmz = Math.abs(dz) > 1e-9 ? (dz > 0 ? (cz + 1) * CELL - oz : oz - cz * CELL) / Math.abs(dz) : Infinity;
  for (let i = 0; i < 400; i++) {
    if (cx < 0 || cz < 0 || cx >= W.gw || cz >= W.gd) { if (i === 0) { /* луч из-за границы */ } break; }
    for (const b of W.grid[cz * W.gw + cx]) {
      if (b.st === st || !b.alive || b.pass) continue; b.st = st;
      if (skip && skip.has(b)) continue;
      if (rayBox(ox, oy, oz, dx, dy, dz, b.x0, b.y0, b.z0, b.x1, b.y1, b.z1) && RB.t < best) {
        best = RB.t; hb = b; nx = ny = nz = 0;
        if (RB.ax === 0) nx = -Math.sign(dx); else if (RB.ax === 1) ny = -Math.sign(dy); else nz = -Math.sign(dz);
      }
    }
    const tn = Math.min(tmx, tmz);
    if (tn > best) break;
    if (tmx < tmz) { cx += sx; tmx += tdx; } else { cz += sz; tmz += tdz; }
  }
  RW.t = best; RW.nx = nx; RW.ny = ny; RW.nz = nz; RW.hit = best < maxT; RW.box = RW.hit ? hb : null; return RW;
}

  if (DIR.conn && DIR.conn.open) { try { DIR.conn.send(info); } catch (e) {} return; }
  if (Date.now() - DIR.connT < 6000) return;
  DIR.connT = Date.now();
  const c = NET.peer.connect(DIR_ID, { reliable: true, serialization: 'json' });
  DIR.conn = c;
  c.on('open', () => { try { c.send(myRoomInfo()); } catch (e) {} });
  c.on('close', () => { if (DIR.conn === c) DIR.conn = null; });
  c.on('error', () => { if (DIR.conn === c) DIR.conn = null; });

  setTimeout(() => { if (!c.open && NET.mode === 'host') { if (DIR.conn === c) DIR.conn = null; dirBecome().then(ok => { if (ok) dirHandle(null, myRoomInfo()); }); } }, 5000);

var tlSel = null, tlDrag = null;
function applyTouchLayout() {
  const L = SET.touchLayout || {};
  for (const id of tbIds()) {
    const el = $(id); if (!el) continue; const c = L[id];
    if (c) { el.style.left = (c.x * 100) + 'vw'; el.style.top = (c.y * 100) + 'vh'; el.style.right = 'auto'; el.style.bottom = 'auto'; el.style.setProperty('--bs', c.s || 1); }
    else { el.style.left = el.style.top = el.style.right = el.style.bottom = ''; el.style.removeProperty('--bs'); }
    el.style.opacity = c && c.o != null ? c.o : (SET.touchOpacity ?? 1);
  }
}
function openTouchEditor() {
  $('settings').classList.add('hidden'); $('tledit').classList.remove('hidden');
  document.body.classList.add('tl-editing'); $('touch').classList.add('on', 'edit');
  for (const id of tbIds()) { const el = $(id); if (el) el.classList.remove('hidden'); }
  tlSel = null; renderTlPanel();
}
function closeTouchEditor() {
  $('tledit').classList.add('hidden'); document.body.classList.remove('tl-editing'); $('touch').classList.remove('edit');
  if (!G.started) $('touch').classList.remove('on');
  saveSettings(); applySettings(); $('settings').classList.remove('hidden');
}
function renderTlPanel() {
  const c = tlSel && (SET.touchLayout || {})[tlSel];
  $('tlsel').textContent = tlSel ? ($(tlSel).textContent.trim() || tlSel) : t('tlPick');
  $('tlsize').disabled = $('tlop').disabled = !tlSel;
  $('tlsize').value = c ? c.s || 1 : 1; $('tlop').value = c && c.o != null ? c.o : (SET.touchOpacity ?? 1);
}
function ensureLayout(id) {
  SET.touchLayout = SET.touchLayout || {};
  if (!SET.touchLayout[id]) { const r = $(id).getBoundingClientRect(); SET.touchLayout[id] = { x: r.left / innerWidth, y: r.top / innerHeight, s: 1 }; }
  return SET.touchLayout[id];
}
document.addEventListener('pointerdown', e => {
  if (!document.body.classList.contains('tl-editing')) return;
  const el = e.target.closest && e.target.closest('#touch .tb'); if (!el) return;
  e.preventDefault(); e.stopPropagation();
  tlSel = el.id; const c = ensureLayout(el.id); tlDrag = { id: el.id, sx: e.clientX, sy: e.clientY, x: c.x, y: c.y };
  for (const id of tbIds()) $(id) && $(id).classList.toggle('tlsel', id === tlSel);
  applyTouchLayout(); renderTlPanel();
}, true);
document.addEventListener('pointermove', e => {
  if (!tlDrag) return;
  const c = SET.touchLayout[tlDrag.id], el = $(tlDrag.id), r = el.getBoundingClientRect();
  c.x = clamp(tlDrag.x + (e.clientX - tlDrag.sx) / innerWidth, 0, 1 - r.width / innerWidth);
  c.y = clamp(tlDrag.y + (e.clientY - tlDrag.sy) / innerHeight, 0, 1 - r.height / innerHeight);
  applyTouchLayout();
}, true);
document.addEventListener('pointerup', () => { tlDrag = null; }, true);
$('tlsize').oninput = () => { if (!tlSel) return; ensureLayout(tlSel).s = +$('tlsize').value; applyTouchLayout(); };
$('tlop').oninput = () => { if (!tlSel) return; ensureLayout(tlSel).o = +$('tlop').value; applyTouchLayout(); };
$('tlreset').onclick = () => { SET.touchLayout = {}; tlSel = null; applyTouchLayout(); renderTlPanel(); };
$('tldone').onclick = () => closeTouchEditor();
addEventListener('resize', applyTouchLayout);
applyTouchLayout();
</script>
</body>
