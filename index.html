<body>
<div id="hud" class="hidden">
  <canvas id="radar" width="200" height="125"></canvas>
  <div id="top">
    <div id="scorebar">
      <span class="t0" data-i18n="team0"></span><span class="num t0" id="s0">0</span>
      <div class="dots" id="dots0"></div>

const angDiff = (a, b) => { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return d; };

/* ================= map ================= */
// Левая верхняя четверть карты; остальное зеркалится. # стена, b ящик (можно запрыгнуть), B высокий ящик, A/Z спавны, C узел связи
const QUAD = [
  '####################',
  '#.........#.........',
  '#..b......#...b.....',
  '#.........#.........',
  '#...###...###..#####',
  '#....b..........#...',
  '#.......b.......#...',
  '###...###...B...#...',
  '#.....#.........b...',
  '#.....#....b........',
  '#AAA..#.......###...',
  '#AAA........B.....CC',
  '#AAA..b.......#...CC',
];
const CELL = 2, WALL_H = 4.5, CRATE_H = 1.1, TALL_H = 2.2, STEP = 0.4, GRAV = 21;
const MAP = (() => {
  const top = QUAD.map(r => r + r.split('').reverse().map(c => c === 'A' ? 'Z' : c).join(''));
  return [...top, ...top.slice(0, -1).reverse()];
})();
const MW = MAP[0].length, MH = MAP.length;
const heights = new Float32Array(MW * MH);
const spawnCells = [[], []], zoneCells = [];
for (let z = 0; z < MH; z++) for (let x = 0; x < MW; x++) {
  const c = MAP[z][x];
  heights[z * MW + x] = c === '#' ? WALL_H : c === 'b' ? CRATE_H : c === 'B' ? TALL_H : 0;
  if (c === 'A') spawnCells[0].push([x, z]);
  if (c === 'Z') spawnCells[1].push([x, z]);
  if (c === 'C') zoneCells.push([x, z]);
}
const hAt = (cx, cz) => (cx < 0 || cz < 0 || cx >= MW || cz >= MH) ? 99 : heights[cz * MW + cx];
const walk = (cx, cz) => hAt(cx, cz) === 0;
const zone = { x0: 1e9, x1: -1e9, z0: 1e9, z1: -1e9 };
for (const [x, z] of zoneCells) { zone.x0 = Math.min(zone.x0, x * CELL); zone.x1 = Math.max(zone.x1, x * CELL + CELL); zone.z0 = Math.min(zone.z0, z * CELL); zone.z1 = Math.max(zone.z1, z * CELL + CELL); }
zone.cx = (zone.x0 + zone.x1) / 2; zone.cz = (zone.z0 + zone.z1) / 2;
const inZone = p => p.x > zone.x0 && p.x < zone.x1 && p.z > zone.z0 && p.z < zone.z1;

function randomCellIn(x0, x1, z0, z1) {
  const c = [];
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) if (walk(x, z)) c.push([x, z]);
  return pick(c);
}

const RB = { t: 0, ax: 0 };
function rayBox(ox, oy, oz, dx, dy, dz, x0, y0, z0, x1, y1, z1) {
  let tmin = -Infinity, tmax = Infinity, ax = -1;
  if (Math.abs(dx) < 1e-9) { if (ox < x0 || ox > x1) return false; }
  else { let a = (x0 - ox) / dx, b = (x1 - ox) / dx; if (a > b) { const t = a; a = b; b = t; } if (a > tmin) { tmin = a; ax = 0; } if (b < tmax) tmax = b; }
  if (Math.abs(dy) < 1e-9) { if (oy < y0 || oy > y1) return false; }
  else { let a = (y0 - oy) / dy, b = (y1 - oy) / dy; if (a > b) { const t = a; a = b; b = t; } if (a > tmin) { tmin = a; ax = 1; } if (b < tmax) tmax = b; }
  if (Math.abs(dz) < 1e-9) { if (oz < z0 || oz > z1) return false; }
  else { let a = (z0 - oz) / dz, b = (z1 - oz) / dz; if (a > b) { const t = a; a = b; b = t; } if (a > tmin) { tmin = a; ax = 2; } if (b < tmax) tmax = b; }
  if (tmax < tmin || tmin < 0) return false;
  RB.t = tmin; RB.ax = ax; return true;
}
const RW = { t: 0, nx: 0, ny: 0, nz: 0, hit: false };
function rayWorld(ox, oy, oz, dx, dy, dz, maxT) {
  let best = maxT, nx = 0, ny = 0, nz = 0;
  if (dy < 0) { const t = -oy / dy; if (t < best) { best = t; ny = 1; } }
  let cx = Math.floor(ox / CELL), cz = Math.floor(oz / CELL);
  const sx = dx > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
  const tdx = Math.abs(dx) > 1e-9 ? Math.abs(CELL / dx) : Infinity, tdz = Math.abs(dz) > 1e-9 ? Math.abs(CELL / dz) : Infinity;
  let tmx = Math.abs(dx) > 1e-9 ? (dx > 0 ? (cx + 1) * CELL - ox : ox - cx * CELL) / Math.abs(dx) : Infinity;
  let tmz = Math.abs(dz) > 1e-9 ? (dz > 0 ? (cz + 1) * CELL - oz : oz - cz * CELL) / Math.abs(dz) : Infinity;
  for (let i = 0; i < 200; i++) {
    const h = hAt(cx, cz);
    if (h > 0 && rayBox(ox, oy, oz, dx, dy, dz, cx * CELL, 0, cz * CELL, cx * CELL + CELL, h, cz * CELL + CELL) && RB.t < best) {
      best = RB.t; nx = ny = nz = 0;
      if (RB.ax === 0) nx = -Math.sign(dx); else if (RB.ax === 1) ny = -Math.sign(dy); else nz = -Math.sign(dz);
      break;
    }
    const tn = Math.min(tmx, tmz);
    if (tn > best || h === 99) break;
    if (tmx < tmz) { cx += sx; tmx += tdx; } else { cz += sz; tmz += tdz; }
  }

}
const RA = { t: 0, head: false };
function rayAgent(ox, oy, oz, dx, dy, dz, a) {
  const H = a.height(), hh = 0.34, p = a.pos;

    if (o === group) return;

    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld));
    if (!byMat.has(o.material)) byMat.set(o.material, []);
    byMat.get(o.material).push(g);

  for (const [mat, geos] of byMat) { const m = new THREE.Mesh(mergeGeometries(geos, false), mat); m.castShadow = true; m.receiveShadow = true; out.add(m); }
  for (const k of keep) out.add(k);

}

    ws.onchange = () => { arWeapon = ws.value; arSel = null; renderArsenal(); };
  }
  const g = $('argrid');
  if (arTab === 's') {
    g.innerHTML = SKIN_TONES.map((c, i) => `<div class="arcard ${PROF.equip.s === i ? 'eq' : ''} ${arSel === i ? 'sel' : ''}" data-id="${i}"><span class="tone" style="background:${c}"></span><b>${esc(t('skinTone'))} ${i + 1}</b><small>${esc(t('free'))}</small></div>`).join('');
  } else {
    const cat = AR_TABS.find(x => x[0] === arTab)[2], cur = arCurrent(arTab);
    g.innerHTML = Object.entries(cat).map(([id, it]) => {
      const own = isOwned(arTab, id), eq = cur === id;
      const tag = eq ? t('equipped') : own ? (it.price ? t('owned') : t('free')) : `${COIN} ${it.price}`;
      return `<div class="arcard ${eq ? 'eq' : ''} ${own ? 'own' : ''} ${arSel === id ? 'sel' : ''}" data-id="${id}">${arIcon(arTab, id, it)}<b>${esc(itemN(it))}</b><small>${esc(tag)}</small></div>`;
    }).join('');
  }
  for (const c of g.children) c.onclick = () => { arSel = arTab === 's' ? +c.dataset.id : c.dataset.id; renderArsenal(); };
  // кнопка действия
  const btn = $('arbuy'), sel = arSel ?? arCurrent(arTab);
  let label, can = true;
  if (arTab === 's') { label = PROF.equip.s === sel ? t('equipped') : t('equip'); can = PROF.equip.s !== sel; }
  else {
    const cat = AR_TABS.find(x => x[0] === arTab)[2], it = cat[sel];
    if (arCurrent(arTab) === sel) { label = t('equipped'); can = false; }
    else if (isOwned(arTab, sel)) label = t('equip');
    else { label = t('buyFor', `${COIN} ${it.price}`); can = PROF.coins >= it.price; if (!can) label += ' — ' + t('notEnough'); }
    $('arsel').textContent = itemN(it) + (arTab === 'w' ? ' · ' + wName(arWeapon) : '');
  }
  if (arTab === 's') $('arsel').textContent = t('skinTone') + ' ' + (sel + 1);
  btn.textContent = label; btn.disabled = !can;
  btn.onclick = () => arAction(sel);
  refreshPreview();
}
function arAction(sel) {
  if (arTab === 's') PROF.equip.s = sel;
  else {
    const cat = AR_TABS.find(x => x[0] === arTab)[2], it = cat[sel];
    if (!isOwned(arTab, sel)) { if (PROF.coins < it.price) return; PROF.coins -= it.price; PROF.owned[arTab + ':' + sel] = true; uiSound('button3'); }
    if (arTab === 'w') PROF.equip.w[arWeapon] = sel; else PROF.equip[arTab] = sel;

}
/* --- ежедневные подарки --- */
function renderDaily() {
  updateCoins();
  const avail = canClaim(), next = avail ? nextStreak() : PROF.daily.streak;
  $('days').innerHTML = DAILY.map((c, i) => {
    const d = i + 1, done = avail ? d < next : d <= next, cur = avail && d === next;
    return `<div class="day ${done ? 'done' : ''} ${cur ? 'cur' : ''}"><small>${esc(t('day', d))}</small><b>${COIN} ${c}</b>${d === 7 ? '<em>🎁</em>' : ''}${done ? '<i>✓</i>' : ''}</div>`;
  }).join('');
  $('claim').disabled = !avail;
  if (!avail && !$('dailymsg').dataset.keep) $('dailymsg').textContent = t('comeBack');
  $('dailybadge').classList.toggle('hidden', !avail);
}
$('claim').onclick = () => {
  const r = claimDaily(); if (!r) return;
  uiSound('button3');
  coinPop(`+${r.coins} ${COIN} ${t('rwDaily')}`);
  $('dailymsg').textContent = `+${r.coins} ${COIN}` + (r.item ? ' · ' + t('gotItem', r.item) : '');
  $('dailymsg').dataset.keep = '1'; renderDaily();
};
/* --- список серверов и настройки комнаты --- */
$('srvrefresh').onclick = () => { $('srvlist').innerHTML = `<p class="sub">${esc(t('srvSearching'))}</p>`; DIR.lastList = Date.now(); dirFetch(); };
$('srvname').value = SET.srvName || ''; $('srvname').oninput = () => { SET.srvName = $('srvname').value.slice(0, 24); saveSettings(); };
$('srvpub').checked = SET.mpPublic !== false; $('srvpub').onchange = () => { SET.mpPublic = $('srvpub').checked; saveSettings(); };
// перерисовка при открытии экранов
const _showMenu = showMenu;
showMenu = scr => { _showMenu(scr); if (menuScreen === 'arsenal') renderArsenal(); if (menuScreen === 'daily') renderDaily(); if (menuScreen === 'mp') { DIR.lastList = 0; dirTick(); } };
applyLocalLook(); updateCoins(); renderDaily();
/* ================= touch controls ================= */
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 }, look = { id: null, lx: 0, ly: 0 };
let touchCrouch = false;
function touchTurn(dx, dy) {
  if (!P.alive || G.paused) return;
  const k = 0.0062 * SET.touchSens * (P.scoped ? SET.scopeSens * ((P.w().zoom || 40) / 40) : 1);
  P.yaw -= dx * k; P.pitch = clamp(P.pitch - dy * k * (SET.invertY ? -1 : 1), -1.5, 1.5); lookDX += dx * 0.5; lookDY += dy * 0.5;
}
function pauseGame() {
  if (!G.started || G.over || G.paused) return;
  G.paused = true; mouseDown = false; keys.TouchJump = false; joy.id = look.id = null; $('joyBase').style.display = 'none';
  if (G.buyOpen) toggleBuy(false);
  showPause();
}
if (TOUCH) {
  const tl = $('touch');
  tl.addEventListener('touchstart', e => {
    e.preventDefault(); initAudio();
    for (const t of e.changedTouches) {
      if (!P.alive) { nextSpec(); continue; }
      if (t.clientX < innerWidth * 0.42 && joy.id === null) {
        joy.id = t.identifier; joy.ox = t.clientX; joy.oy = t.clientY; joy.x = joy.y = 0;
        const jb = $('joyBase'); jb.style.display = 'block'; jb.style.left = t.clientX + 'px'; jb.style.top = t.clientY + 'px'; $('joyKnob').style.transform = '';
      } else if (look.id === null) { look.id = t.identifier; look.lx = t.clientX; look.ly = t.clientY; }
    }
  }, { passive: false });
  document.addEventListener('touchmove', e => {
    if (!G.started) return;
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) {
        let dx = t.clientX - joy.ox, dy = t.clientY - joy.oy; const d = Math.hypot(dx, dy), R = 55;
        if (d > R) { dx *= R / d; dy *= R / d; }
        joy.x = dx / R; joy.y = dy / R; $('joyKnob').style.transform = `translate(${dx}px,${dy}px)`;
      } else if (t.identifier === look.id) { touchTurn(t.clientX - look.lx, t.clientY - look.ly); look.lx = t.clientX; look.ly = t.clientY; }
    }
    if (e.cancelable && $('touch').classList.contains('on') && !G.paused && !G.buyOpen) e.preventDefault();
  }, { passive: false });
  const endT = e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) { joy.id = null; joy.x = joy.y = 0; $('joyBase').style.display = 'none'; }
      if (t.identifier === look.id) look.id = null;
    }
  };
  document.addEventListener('touchend', endT); document.addEventListener('touchcancel', endT);
  const tbtn = (id, down, up) => {
    const el = $(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); initAudio(); el.classList.add('pr'); down(e.changedTouches[0]); }, { passive: false });
    const u = e => { el.classList.remove('pr'); if (up) up(e.changedTouches[0]); };
    el.addEventListener('touchend', u); el.addEventListener('touchcancel', u);
  };
  tbtn('tFire', t => { if (!P.alive) { nextSpec(); return; } mouseDown = true; if (look.id === null) { look.id = t.identifier; look.lx = t.clientX; look.ly = t.clientY; } }, () => { mouseDown = false; });
  tbtn('tJump', () => { keys.TouchJump = true; }, () => { keys.TouchJump = false; });
  tbtn('tCrouch', () => { touchCrouch = !touchCrouch; });
  tbtn('tReload', () => { if (P.alive) startReload(P); });
  tbtn('tSwap', () => { if (!P.alive) return; const order = [1, 2, 3]; let i = order.indexOf(P.slot); for (let k = 1; k <= 3; k++) { const s = order[(i + k) % 3]; if (P.inv[s]) { switchSlot(P, s); break; } } });
  tbtn('tDash', () => dash());
  tbtn('tNade', () => { if (P.alive) throwNade(P); });
  tbtn('tScope', () => toggleScope());
  tbtn('tNadeSel', () => cycleNade());
  tbtn('tChat', () => openChat());
  tbtn('tStart', () => hostStartMatch());
  tbtn('tBuy', () => toggleBuy());
  tbtn('tBoard', () => { G.board = !G.board; if (G.board) renderBoard(); else $('board').classList.add('hidden'); });
  tbtn('tPause', () => pauseGame());
  document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
}
// для Android-приложения: системная кнопка «Назад» и сворачивание
window.__onAppPause = () => pauseGame();
window.__onBack = () => {
  if (G.buyOpen) { toggleBuy(false); return true; }
  if (G.board) { G.board = false; $('board').classList.add('hidden'); return true; }
  if (G.started && !G.over && !G.paused) { pauseGame(); return true; }
  if (!$('settings').classList.contains('hidden')) { $('settings').classList.add('hidden'); return true; }
  if (chatOpen) { closeChat(); return true; }
  if (G.started) { goToMenu(); return true; }
  if ($('menu').classList.contains('sub-open')) { $('menu').classList.remove('sub-open'); return true; }
  return false;
};

window.__game = { G, agents, SET, toggleBuy, buyKey, chat: sendChat, uiBufs, applySettings, hostStartMatch, startLobby, throwNade, WEAPONS, get P() { return P; }, NET, renderer, fire, damage, buy: buyItem, animateSoldier, vm, vmGuns, get now() { return now; }, findPath, spawnCells, zoneCells, walk, step: (n, dt = 1 / 60) => { for (let i = 0; i < n && G.state !== "over"; i++) { now += dt; updateGame(dt); } } };
</script>
